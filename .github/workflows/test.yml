name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # keep original line endings: the installer and tests depend on exact bytes
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*   # same Node.js LTS that Setup.bat installs
      - run: npm test
