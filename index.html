<style>
:root {
  --bg:#f5f1e9; --surface:#fffdf8; --sunk:#ede7dc; --ink:#201d18; --mut:#7a7268; --line:#e3dccf;
  --gold:#b8862b; --gold-bg:#fbf3e2; --user:#23201b; --user-ink:#f7f2e8; --danger:#c2412d; --link:#2563b0; --ok:#2f8a55;

}
:root[data-theme="dark"] {
  --bg:#13120f; --surface:#1c1a16; --sunk:#232019; --ink:#ece5d8; --mut:#9a9184; --line:#2e2a23;

}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { font:15px/1.75 var(--sans); background:var(--bg); color:var(--ink); display:grid; grid-template-columns:272px 1fr; overflow:hidden; }

.brand { display:flex; align-items:baseline; gap:8px; padding:0 6px 6px; }

#chats .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }

.sidefoot .icon { flex:1; width:auto; gap:6px; display:flex; font-size:13px; }

/* ---------- 主區 ---------- */

header { display:flex; align-items:center; gap:8px; padding:12px 22px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(8px); }

/* 使用者提問 */

.ask { display:flex; flex-direction:column; align-items:flex-end; gap:6px; margin-bottom:20px; }
.bubble { background:var(--user); color:var(--user-ink); padding:12px 18px; border-radius:20px 20px 4px 20px; max-width:min(720px, 88%); white-space:pre-wrap; box-shadow:var(--shadow); }

.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; align-items:start; }

/* AI 卡片 */

.more:hover { color:var(--ink); }

@keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }

@keyframes sh { to { background-position:-200% 0; } }

/* 總結 */
.summary { margin-top:22px; background:var(--gold-bg); border:1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); border-radius:18px; padding:4px 6px 6px; box-shadow:var(--shadow); }

.md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }

.mode { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; transition:.15s; }

/* 輸入區 */
footer { padding:0 22px 18px; }
.composer { max-width:1100px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:12px 14px 10px; transition:border-color .15s; }
.composer { position:relative; }
#skpop { position:absolute; left:10px; right:10px; bottom:calc(100% + 8px); max-height:340px; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.18); padding:6px; z-index:4; }

.sk-i { display:flex; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; align-items:flex-start; }
.sk-i.on { background:var(--sunk); }

.sk-i b { font:500 13.5px var(--mono); }
.sk-i small { color:var(--mut); display:block; font-size:12px; line-height:1.5; }
.sk-i .tag { font-size:10.5px; border:1px solid var(--line); border-radius:999px; padding:0 7px; margin-left:6px; color:var(--mut); font-family:var(--sans); }

#skbtn { font-size:13px; }
.composer:focus-within { border-color:color-mix(in srgb, var(--gold) 60%, var(--line)); }
.qwrap { position:relative; }
#q, #qhl { font:inherit; line-height:1.7; letter-spacing:normal; padding:0; margin:0; border:0; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; scrollbar-gutter:stable; }
#q { display:block; width:100%; outline:none; resize:none; background:none; min-height:48px; max-height:240px; position:relative; z-index:1; color:transparent; caret-color:var(--ink); }

#qhl { position:absolute; inset:0; overflow:hidden; color:var(--ink); pointer-events:none; }
#qhl .hl-ok { color:var(--gold); background:color-mix(in srgb, var(--gold) 18%, transparent); border-radius:4px; box-shadow:0 0 0 1px color-mix(in srgb, var(--gold) 45%, transparent); }
#qhl .hl-url { color:var(--link); background:color-mix(in srgb, var(--link) 13%, transparent); border-radius:4px; box-shadow:0 0 0 1px color-mix(in srgb, var(--link) 35%, transparent); }
.skchip.url { background:color-mix(in srgb, var(--link) 9%, var(--surface)); border-color:color-mix(in srgb, var(--link) 45%, var(--line)); }
.skchip.url b { color:var(--link); font-family:var(--sans); max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.skchip .ic { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:var(--link); color:#fff; font-size:10px; }
.bubble a { color:inherit; text-decoration:underline; text-underline-offset:3px; }
.bubble .bsk { font-family:var(--mono); font-size:.93em; padding:0 4px; border-radius:4px; background:rgba(220,170,75,.28); }
#qhl .hl-bad { text-decoration:underline wavy var(--danger); text-underline-offset:4px; }
#skchips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
#skchips:empty { display:none; }
.skchip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 6px 3px 4px; border-radius:999px; background:var(--gold-bg); border:1px solid color-mix(in srgb, var(--gold) 50%, var(--line)); }
.skchip .av { width:18px; height:18px; font-size:9px; }
.skchip b { font:500 12.5px var(--mono); color:var(--gold); }
.skchip small { color:var(--mut); font-size:11.5px; }
.skchip.bad { background:none; border-color:var(--danger); }
.skchip.bad b { color:var(--danger); }
.skchip button { color:var(--mut); padding:0 4px; font-size:12px; } .skchip button:hover { color:var(--ink); }
.bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
.aichip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:3px 11px 3px 4px; font-size:13px; transition:.15s; opacity:.5; }
.aichip .av { width:20px; height:20px; font-size:10px; filter:grayscale(1); }
.aichip[aria-pressed="true"] { opacity:1; border-color:var(--c); background:color-mix(in srgb, var(--c) 10%, transparent); }

.sel { border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:var(--surface); font-size:13px; outline:none; }

.small { font-size:12px; color:var(--mut); }
/* 設定精靈 */
.srow { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
.srow:last-child { border-bottom:none; }
.srow .st { font-size:12.5px; margin-left:8px; }

#toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); background:var(--ink); color:var(--bg); padding:8px 18px; border-radius:999px; font-size:13.5px; opacity:0; transition:.25s; pointer-events:none; z-index:9; }

<script>
const HELP_URL = 'https://samtss.com/tools/ai-roundtable/';
const AVI = { chatgpt:'G', claude:'C', gemini:'✦', grok:'X' };
const MODES = {
  discuss:    { name:'一般討論', p1:'各自提案', pn:'互相評論', d:'各自提案 → 互相評論 → 主持人整理結論', ex:'幫我評估：週末快閃店要選百貨中庭還是捷運站？' },
  debate:     { name:'正反辯論', p1:'立論', pn:'交鋒', d:'第一位當正方、第二位當反方，其餘當評審', ex:'公司該不該全面導入 AI 工具？' },
  brainstorm: { name:'腦力激盪', p1:'發想', pn:'延伸組合', d:'大量發想，再互相延伸，選出前三名', ex:'幫扭蛋店想 10 個社群互動活動' },
  review:     { name:'互相審查', p1:'初答', pn:'嚴格審查', d:'先回答，再互相挑錯，得到最可靠的答案', ex:'檢查這段活動企劃有什麼風險：' },
};
let D = { projects:[], settings:{ ais:{} } }, pid = localStorage.pid, cid = localStorage.cid;
let chat = null, run = null, lastKey = '', offset = 0, wasHere = false;
const opened = new Set(), expanded = new Set(), closed = new Set();
const SU = { list:null, test:{}, busy:{}, shown:false };   // 設定精靈的狀態
let pref = {}; try { pref = JSON.parse(localStorage.pref || '{}'); } catch {}

const $ = s => document.querySelector(s);
const TOKEN = $('meta[name=rt-token]')?.content || '';   // 伺服器每次啟動換一組，只有這個視窗拿得到
const api = async (u, b) => {
  const r = await fetch(u, { headers:{ 'X-RT-Token':TOKEN }, ...(b === undefined ? {} : { method:'POST', body:JSON.stringify(b) }) });
  if (r.status === 403) { location.reload(); return new Promise(() => {}); }   // 伺服器重開過，token 已換：重新載入頁面
  return r.json();
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const P = () => D.projects.find(p => p.id === pid);
const ai = id => D.settings.ais[id] || { name:id, cmd:'' };
const col = id => `var(--${id in AVI ? id : 'grok'})`;
const av = id => `<span class="av" style="--c:${col(id)}">${AVI[id] || esc(ai(id).name[0])}</span>`;
const secs = ms => ms < 60000 ? Math.round(ms / 1000) + ' 秒' : Math.floor(ms / 60000) + ' 分 ' + Math.round(ms % 60000 / 1000) + ' 秒';
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1800); }
function savePref() { localStorage.pref = JSON.stringify(pref); }

/* ---------- 簡易 Markdown ---------- */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const out = [], parts = String(src || '').split(/```[^\n]*\n?/);
  parts.forEach((part, k) => {
    if (k % 2) { out.push(`<pre><code>${esc(part.replace(/\n$/, ''))}</code></pre>`); return; }
    const L = part.split('\n'); let i = 0, para = [];
    const flush = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    while (i < L.length) {
      const l = L[i], t = l.trim();
      if (!t) { flush(); i++; continue; }
      let m;
      if (t.startsWith('|') && /^\|?\s*:?-{2,}/.test((L[i + 1] || '').trim())) {
        flush(); const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
        let h = `<table><tr>${row(l).map(c => `<th>${c}</th>`).join('')}</tr>`; i += 2;
        while (i < L.length && L[i].trim().startsWith('|')) h += `<tr>${row(L[i++]).map(c => `<td>${c}</td>`).join('')}</tr>`;
        out.push(h + '</table>'); continue;
      }
      if ((m = t.match(/^(#{1,4})\s+(.*)/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flush(); out.push('<hr>'); i++; continue; }
      if (t.startsWith('>')) { flush(); const q = []; while (i < L.length && L[i].trim().startsWith('>')) q.push(L[i++].trim().replace(/^>\s?/, '')); out.push(`<blockquote>${q.map(inline).join('<br>')}</blockquote>`); continue; }
      const ul = /^\s*[-*+•]\s+/, ol = /^\s*\d+[.)、]\s+/;
      if (ul.test(l) || ol.test(l)) {
        flush(); const isOl = ol.test(l), re = isOl ? ol : ul, items = [];
        while (i < L.length && re.test(L[i])) {
          let it = L[i++].replace(re, '');
          while (i < L.length && L[i].trim() && !ul.test(L[i]) && !ol.test(L[i]) && /^\s{2,}/.test(L[i])) it += '<br>' + L[i++].trim();
          items.push(it);
        }
        out.push(`<${isOl ? 'ol' : 'ul'}>${items.map(x => `<li>${inline(x).replace(/&lt;br&gt;/g, '<br>')}</li>`).join('')}</${isOl ? 'ol' : 'ul'}>`); continue;
      }
      para.push(l); i++;
    }
    flush();
  });
  return out.join('');
}

/* ---------- 側欄 ---------- */
function when(ts) {
  const d = new Date(ts), n = new Date();
  return d.toDateString() === n.toDateString() ? d.toTimeString().slice(0, 5) : `${d.getMonth() + 1}/${d.getDate()}`;
}
function renderSide() {
  $('#proj').innerHTML = D.projects.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const kw = $('#search').value.trim().toLowerCase(), list = ((P() || {}).chats || []).filter(c => !kw || c.title.toLowerCase().includes(kw));
  $('#chats').innerHTML = list.map(c => `<li class="${c.id === cid ? 'on' : ''}" data-id="${c.id}">
      <span class="t">${esc(c.title)}</span><span class="d">${when(c.updated)}</span>
      <span class="acts"><button data-ren="${c.id}" title="重新命名">✎</button><button data-del="${c.id}" title="刪除">✕</button></span></li>`).join('')
    || `<li class="small" style="cursor:default">${kw ? '找不到符合的對話' : '還沒有對話'}</li>`;
}
function renderComposer() {
  const keys = Object.keys(D.settings.ais);
  if (!pref.ids) pref.ids = keys.filter(k => ai(k).cmd);
  pref.ids = pref.ids.filter(k => keys.includes(k));
  $('#ais').innerHTML = keys.map(k => `<button class="aichip" style="--c:${col(k)}" data-ai="${k}" aria-pressed="${pref.ids.includes(k)}">${av(k)}${esc(ai(k).name)}${ai(k).cmd ? '' : '<small>手動</small>'}</button>`).join(' ');
  $('#mod').innerHTML = keys.map(k => `<option value="${k}">${esc(ai(k).name)}</option>`).join('');
  $('#mod').value = keys.includes(pref.mod) ? pref.mod : (keys.includes('chatgpt') ? 'chatgpt' : keys[0]);
  $('#mode').value = pref.mode || 'discuss'; $('#rounds').value = pref.rounds || '2';
  const solo = pref.ids.length < 2;
  $('#rounds').disabled = $('#mod').disabled = $('#mode').disabled = solo;
}
async function load() {
  D = await api('/api/projects');
  if (!P()) pid = D.projects[0] && D.projects[0].id;
  const p = P(); if (p && !p.chats.find(c => c.id === cid)) cid = p.chats[0] && p.chats[0].id;
  localStorage.pid = pid || ''; localStorage.cid = cid || '';
  renderSide(); renderComposer(); lastKey = ''; await tick();
  if (!D.settings.setupDone && !SU.shown) { SU.shown = true; openSetup(); }   // 第一次開啟
}

/* ---------- 對話內容 ---------- */
function card(m, key, extra = '') {
  const id = m.ai, long = (m.text || '').length > 900, open = expanded.has(key);
  if (m.error) return `<div class="card err" style="--c:${col(id)}"><div class="hd">${av(id)}<span class="nm">${esc(ai(id).name)}</span></div><div class="bd">失敗：${esc(m.error)}</div></div>`;
  return `<div class="card" style="--c:${col(id)}">
    <div class="hd">${av(id)}<span class="nm">${esc(ai(id).name)}</span>${extra}<span class="tm">${m.ms ? secs(m.ms) : ''}</span><button class="cp" data-copytext="${esc(key)}">複製</button></div>
    <div class="bd md ${long && !open ? 'clamp' : ''}">${md(m.text)}</div>
    ${long ? `<button class="more" data-exp="${esc(key)}">${open ? '收合' : '展開全文'}</button>` : ''}</div>`;
}
function busyCard(id, since) {
  return `<div class="card busy" style="--c:${col(id)}"><div class="hd">${av(id)}<span class="nm">${esc(ai(id).name)}</span><span class="tm" data-since="${since}"></span></div>
    <div class="bd"><span class="dots"><span></span><span></span><span></span></span>思考中<div class="shimmer"></div><div class="shimmer" style="width:70%"></div></div></div>`;
}
const texts = {};
function renderChat() {
  const box = $('#inner'), log = $('#log');
  if (!chat || !chat.turns.length) {
    $('#title').textContent = chat ? chat.title : 'AI圓桌會議';
    const seats = Object.keys(D.settings.ais).map(av).join('');
    box.innerHTML = `<div class="welcome"><div class="seats">${seats}</div><h1>讓 AI 們圍坐一桌</h1>
      <p>提出問題，它們會各自提案、互相挑戰，最後由主持人整理出結論。</p>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="mode" data-mode="${k}" data-ex="${esc(m.ex)}"><b>${m.name}</b><small>${m.d}</small><em>試試：${esc(m.ex)}</em></button>`).join('')}</div>
      <div class="credit">AI圓桌會議 v1.0 · 由 <a href="https://samtss.com/" target="_blank" rel="noopener">山姆蛋實驗室 SamEgg Lab</a> 製作　·　<a href="${HELP_URL}" target="_blank" rel="noopener">使用說明與常見問題</a></div></div>`;
    return;
  }
  $('#title').textContent = chat.title;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 160;
  const here = run && run.pid === pid && run.cid === cid;
  box.innerHTML = chat.turns.map((t, ti) => {
    const solo = t.ids.length === 1, M = MODES[t.mode] || MODES.discuss, last = ti === chat.turns.length - 1;
    const running = here && last && t.status === 'running', busy = running ? run.busy : [];
    const msgs = t.msgs.map((m, mi) => { texts[`${ti}-${mi}`] = m.text; return { ...m, key:`${ti}-${mi}` }; });
    let h = `<div class="turn"><div class="ask"><div class="bubble">${richQ(t.q)}</div><div class="meta">
      ${solo ? '' : `<span class="chip">${M.name}</span><span class="chip">${t.rounds} 輪</span>`}${Object.entries(t.shared || {}).map(([n, v]) => `<span class="chip" title="這個技能屬於 ${esc(ai(v.from).name)}，已把說明轉述給 ${v.to.map(i => esc(ai(i).name)).join('、')}">⚡ $${esc(n)} → ${v.to.map(i => esc(ai(i).name)).join('、')}</span>`).join('')}${t.ids.map(i => esc(ai(i).name)).join('、')}
      · ${when(t.at)}</div></div>`;
    if (solo) {
      h += `<div class="grid" style="grid-template-columns:1fr">${msgs.filter(m => !m.sum).map(m => card(m, m.key)).join('')}${busy.map(([i, b]) => busyCard(i, b.since)).join('')}</div>`;
    } else {
      const hasSum = msgs.some(m => m.sum && !m.old && !m.error);
      for (let r = 1; r <= t.rounds; r++) {
        const rm = msgs.filter(m => m.round === r).sort((x, y) => t.ids.indexOf(x.ai) - t.ids.indexOf(y.ai)), rb = busy.filter(([, b]) => b.r === r);
        if (!rm.length && !rb.length) continue;
        const k = `${chat.id}-${ti}-${r}`, isOpen = opened.has(k) || (!closed.has(k) && (!hasSum || r === t.rounds || !last));
        h += `<details class="round" data-k="${k}" ${isOpen ? 'open' : ''}><summary><span class="arr">›</span><b>第 ${r} 輪</b>${r === 1 ? M.p1 : M.pn}</summary>
          <div class="grid">${rm.map(m => card(m, m.key)).join('')}${rb.map(([i, b]) => busyCard(i, b.since)).join('')}</div></details>`;
      }
      const olds = msgs.filter(m => m.sum && m.old && !m.error);
      if (olds.length) h += `<details class="oldsum"><summary>先前的總結（${olds.length}）</summary>${olds.map(m => card(m, m.key)).join('')}</details>`;
      const sm = msgs.filter(m => m.sum && !m.old).pop();
      const sumBusy = busy.find(([, b]) => b.r === 'sum');
      if (sm && !sm.error) h += `<div class="summary"><div class="hd"><span class="seal">結　論</span><span class="small">主持人 ${esc(ai(sm.ai).name)}${sm.ms ? ' · ' + secs(sm.ms) : ''}</span></div><div class="bd md">${md(sm.text)}</div></div>`;
      else if (sm) h += card(sm, sm.key, '<span class="small">（總結）</span>');
      else if (sumBusy) h += `<div class="summary"><div class="hd"><span class="seal">結　論</span><span class="small">主持人 ${esc(ai(sumBusy[0]).name)} 整理中… <span data-since="${sumBusy[1].since}"></span></span></div><div class="bd"><div class="shimmer"></div><div class="shimmer" style="width:60%"></div></div></div>`;
    }
    const st = { stopped:'已中止', interrupted:'已中斷（程式曾被關閉）', error:'錯誤：' + (t.err || '') }[t.status];
    if (st) h += `<div class="status">${esc(st)}</div>`;
    if (!running && (t.summary || st)) {
      h += `<div class="tools">`;
      if (t.summary) h += `<button class="btn" data-mem="${ti}">＋ 加入專案記憶</button><button class="btn" data-copysum="${ti}">複製結論</button>`;
      if (last && !solo && !run) h += `<button class="btn" data-continue>再討論一輪</button>`;
      h += `<button class="btn" data-reask="${ti}">重新提問</button></div>`;
    }
    return h + '</div>';
  }).join('');
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function tick() {
  if (!pid) return;
  const r = cid ? await api(`/api/chat?pid=${pid}&cid=${cid}`) : await api(`/api/chat?pid=${pid}&cid=`);
  offset = r.now - Date.now(); run = r.run; chat = r.chat;
  const here = run && run.pid === pid && run.cid === cid;
  const sendBtn = $('#send');
  sendBtn.classList.toggle('stop', !!run);
  sendBtn.innerHTML = run ? '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  sendBtn.title = run ? '中止討論' : '送出（Ctrl+Enter）';
  $('#timer').dataset.since = run ? run.at : '';
  if (run && !here) $('#timer').dataset.other = '1'; else delete $('#timer').dataset.other;
  const pd = run && run.pending; $('#pend').hidden = !pd;
  if (pd) { $('#who').textContent = ai(pd.ai).name; if ($('#pp').value !== pd.prompt) $('#pp').value = pd.prompt; }
  if (wasHere && !run) notifyDone();
  wasHere = !!here;
  const key = JSON.stringify([chat, here && run.busy, D.settings]);
  if (key !== lastKey) { lastKey = key; renderChat(); }
  clock();
}
function clock() {
  const now = Date.now() + offset;
  document.querySelectorAll('[data-since]').forEach(e => {
    const s = +e.dataset.since;
    if (e.id === 'timer') e.textContent = s ? (e.dataset.other ? '另一個對話正在討論中 · ' : '討論中 · ') + secs(now - s) : '';
    else e.textContent = s ? secs(now - s) : '';
  });
}
function notifyDone() {
  if (!document.hidden) return;
  document.title = '✓ 討論完成 · AI圓桌會議';
  if (window.Notification && Notification.permission === 'granted') new Notification('AI圓桌會議：討論完成', { body: chat ? chat.title : '' });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = 'AI圓桌會議 · 山姆蛋實驗室'; });

/* ---------- 動作 ---------- */
async function sendQ() {
  if (run) return api('/api/stop', {}).then(tick);
  const q = $('#q').value.trim(); if (!q) return $('#q').focus();
  if (!pref.ids.length) return toast('請至少選一個 AI');
  if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
  if (!cid) cid = (await api('/api/chat/new', { pid })).id;
  const r = await api('/api/send', { pid, cid, q, ids:pref.ids, mode:$('#mode').value, mod:$('#mod').value, rounds:+$('#rounds').value });
  if (r.error) return toast(r.error);
  $('#q').value = ''; autosize(); await load();
  $('#log').scrollTop = $('#log').scrollHeight;
}
function chatMarkdown() {
  if (!chat) return '';
  let s = `# ${chat.title}\n\n`;
  chat.turns.forEach(t => {
    s += `## 問題\n\n${t.q}\n\n`;
    const solo = t.ids.length === 1;
    for (let r = 1; r <= t.rounds; r++) t.msgs.filter(m => m.round === r && !m.error).forEach(m => { s += `### ${solo ? '' : `第 ${r} 輪 · `}${ai(m.ai).name}\n\n${m.text}\n\n`; });
    const sm = t.msgs.filter(m => m.sum && !m.old && !m.error).pop();
    if (sm && !solo) s += `### 結論（主持人 ${ai(sm.ai).name}）\n\n${sm.text}\n\n`;
    s += '---\n\n';
  });
  return s;
}
const copy = async (t, msg) => { await navigator.clipboard.writeText(t || ''); toast(msg || '已複製'); };
function autosize() { const q = $('#q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 240) + 'px'; renderHL(); }

/* 輸入框裡的技能標示：認得的技能變成金色，認不得的加紅色波浪線，上方列出已讀入的技能 */
const SKRE = /\$([A-Za-z0-9][\w.-]*)|(https?:\/\/[^\s<>"'）)\]】」，。、]+)/g;
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
function richQ(v) {   // 對話紀錄裡的提問：網址可點、技能標色
  let h = '', last = 0;
  for (const m of String(v).matchAll(SKRE)) {
    h += esc(v.slice(last, m.index)); last = m.index + m[0].length;
    if (m[2]) h += `<a href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[2])}</a>`;
    else h += findSk(m[1]).length ? `<span class="bsk">${esc(m[0])}</span>` : esc(m[0]);
  }
  return h + esc(v.slice(last));
}
const findSk = n => SK.filter(x => x.name.toLowerCase() === n.replace(/[.]+$/, '').toLowerCase());
function renderHL() {
  const v = $('#q').value; let html = '', last = 0; const found = new Map(), bad = new Set(), urls = new Set();
  for (const m of v.matchAll(SKRE)) {
    if (m[2]) { urls.add(m[2]); html += esc(v.slice(last, m.index)) + `<span class="hl-url">${esc(m[0])}</span>`; last = m.index + m[0].length; continue; }
    const own = findSk(m[1]), ok = own.length > 0, cls = ok ? 'hl-ok' : (SK.length ? 'hl-bad' : '');
    if (ok) found.set(own[0].name, own); else if (SK.length) bad.add(m[1]);
    html += esc(v.slice(last, m.index)) + (cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0])); last = m.index + m[0].length;
  }
  $('#qhl').innerHTML = html + esc(v.slice(last)) + '\n';
  $('#qhl').scrollTop = $('#q').scrollTop;
  const sel = pref.ids || [];
  $('#skchips').innerHTML = [...found].map(([n, own]) => {
    const owners = own.map(x => x.ai), use = sel.filter(i => owners.includes(i)), relay = sel.filter(i => !owners.includes(i));
    const note = [use.length ? `${use.map(i => esc(ai(i).name)).join('、')} 直接使用` : '', relay.length ? `轉述給 ${relay.map(i => esc(ai(i).name)).join('、')}` : ''].filter(Boolean).join('　·　');
    return `<span class="skchip" title="${esc(own[0].desc)}">${av(own[0].ai)}<b>⚡ $${esc(n)}</b><small>${note || '已讀入'}</small><button data-rmsk="${esc(n)}" title="移除">✕</button></span>`;
  }).join('') + [...bad].map(n => `<span class="skchip bad"><b>$${esc(n)}</b><small>找不到這個技能</small></span>`).join('')
    + [...urls].map(u => `<span class="skchip url" title="${esc(u)}"><span class="ic">↗</span><b>${esc(host(u))}</b><small>能上網的 AI 會先讀取這個網頁</small><button data-rmurl="${esc(u)}" title="移除">✕</button></span>`).join('');
}
$('#q').addEventListener('scroll', () => { $('#qhl').scrollTop = $('#q').scrollTop; });
$('#skchips').onclick = e => {
  const u = e.target.dataset.rmurl;
  if (u) { const q = $('#q'); q.value = q.value.split(u).join('').replace(/  +/g, ' '); autosize(); return q.focus(); }
  const n = e.target.dataset.rmsk; if (!n) return;
  const q = $('#q'); q.value = q.value.replace(new RegExp('\\$' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w-])\\s?', 'gi'), ''); autosize(); q.focus();
};

$('#q').addEventListener('input', autosize);
/* ---------- 技能選單 ---------- */
let SK = [], skItems = [], skIdx = 0;
async function loadSkills(refresh) { try { SK = await api('/api/skills' + (refresh ? '?refresh=1' : '')); } catch { SK = []; } }
function skToken() {
  const q = $('#q'), pos = q.selectionStart, m = q.value.slice(0, pos).match(/(^|\s)([\/$])([^\s\/$]*)$/);
  return m ? { start: pos - m[3].length - 1, end: pos, kw: m[3].toLowerCase() } : null;
}
function showSk(force) {
  const t = skToken(); if (!t && !force) return hideSk();
  const kw = t ? t.kw : '';
  skItems = SK.filter(x => !kw || x.name.toLowerCase().includes(kw) || x.desc.toLowerCase().includes(kw)).slice(0, 80);
  skIdx = 0; renderSk();
}
function renderSk() {
  const box = $('#skpop'); box.hidden = false;
  const head = `<div class="sh"><span>已安裝的技能 · ${SK.length}</span><button data-skref>重新掃描</button></div>`;
  if (!skItems.length) {
    box.innerHTML = head + `<div class="sk-empty">${SK.length ? '找不到符合的技能。' : '沒有找到任何技能。<br>目前會掃描 ChatGPT 的 <code>.codex\\skills</code>、Claude 的 <code>.claude\\skills</code> 等資料夾。'}</div>`;
    return;
  }
  box.innerHTML = head + skItems.map((x, i) => `<div class="sk-i ${i === skIdx ? 'on' : ''}" data-ski="${i}">${av(x.ai)}<div><b>$${esc(x.name)}</b>${x.system ? '<span class="tag">內建</span>' : ''}${ai(x.ai).skills ? '' : '<span class="tag">技能未開啟</span>'}<span class="tag">其他 AI 會收到轉述</span><small>${esc(x.desc || '（沒有說明）')}</small></div></div>`).join('');
  const on = box.querySelector('.sk-i.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
function hideSk() { $('#skpop').hidden = true; skItems = []; }
function chooseSk(i) {
  const x = skItems[i]; if (!x) return;
  const q = $('#q'), t = skToken(), ins = '$' + x.name + ' ';
  const a = t ? t.start : q.selectionStart, b = t ? t.end : q.selectionEnd;
  q.value = q.value.slice(0, a) + ins + q.value.slice(b);
  q.selectionStart = q.selectionEnd = a + ins.length; hideSk(); q.focus(); autosize();
  if (!pref.ids.includes(x.ai)) toast(`這是 ${ai(x.ai).name} 的技能，記得勾選 ${ai(x.ai).name}`);
  else if (!ai(x.ai).skills) toast(`記得在 AI 設定開啟 ${ai(x.ai).name} 的「允許使用技能與工具」`);
}
$('#skpop').addEventListener('mousedown', async e => {
  e.preventDefault();
  if (e.target.closest('[data-skref]')) { await loadSkills(true); return showSk(true); }
  const it = e.target.closest('[data-ski]'); if (it) chooseSk(+it.dataset.ski);
});
$('#skbtn').onclick = async () => { if (!$('#skpop').hidden) return hideSk(); await loadSkills(); $('#q').focus(); showSk(true); };
$('#q').addEventListener('input', () => showSk(false));
$('#q').addEventListener('blur', () => setTimeout(hideSk, 150));
$('#q').onkeydown = e => {
  if (!$('#skpop').hidden && skItems.length) {
    if (e.key === 'ArrowDown') { e.preventDefault(); skIdx = (skIdx + 1) % skItems.length; return renderSk(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); skIdx = (skIdx - 1 + skItems.length) % skItems.length; return renderSk(); }
    if ((e.key === 'Enter' && !e.ctrlKey && !e.metaKey) || e.key === 'Tab') { e.preventDefault(); return chooseSk(skIdx); }
  }
  if (e.key === 'Escape') return hideSk();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); hideSk(); sendQ(); }
};
loadSkills().then(renderHL);
$('#send').onclick = sendQ;
$('#ais').onclick = e => {
  const b = e.target.closest('[data-ai]'); if (!b) return;
  const k = b.dataset.ai; pref.ids = pref.ids.includes(k) ? pref.ids.filter(x => x !== k) : [...pref.ids, k];
  savePref(); renderComposer(); renderHL();
};
['mode', 'rounds', 'mod'].forEach(k => $('#' + k).onchange = e => { pref[k] = e.target.value; savePref(); });
$('#proj').onchange = e => { pid = e.target.value; cid = null; load(); };
$('#search').oninput = renderSide;
$('#newc').onclick = async () => { cid = (await api('/api/chat/new', { pid })).id; document.body.classList.remove('side'); await load(); $('#q').focus(); };
$('#newp').onclick = async () => { const n = prompt('新專案名稱'); if (n) { pid = (await api('/api/project/new', { name:n })).id; cid = null; load(); } };
$('#chats').onclick = async e => {
  const { del, ren } = e.target.dataset;
  if (del) { if (confirm('刪除這個對話？')) { const r = await api('/api/chat/delete', { pid, cid:del }); if (r.error) return toast(r.error); if (del === cid) cid = null; load(); } return; }
  if (ren) return renameChat(ren);
  const li = e.target.closest('li[data-id]'); if (li) { cid = li.dataset.id; document.body.classList.remove('side'); load(); }
};
async function renameChat(id) {
  const c = (P().chats || []).find(x => x.id === id), n = prompt('對話名稱', c ? c.title : '');
  if (n && n.trim()) { await api('/api/chat/rename', { pid, cid:id, title:n }); load(); }
}
$('#rename').onclick = () => cid && renameChat(cid);
$('#title').ondblclick = () => cid && renameChat(cid);
$('#export').onclick = () => {
  if (!chat || !chat.turns.length) return toast('這個對話還沒有內容');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([chatMarkdown()], { type:'text/markdown' }));
  a.download = chat.title.replace(/[\\/:*?"<>|]/g, '_') + '.md'; a.click();
};
$('#copyall').onclick = () => copy(chatMarkdown(), '已複製整段對話');
$('#menu').onclick = () => document.body.classList.toggle('side');
$('#log').onclick = async e => {
  const d = e.target.closest('[data-mem],[data-copysum],[data-continue],[data-reask],[data-copytext],[data-exp],[data-mode]');
  if (!d) { document.body.classList.remove('side'); return; }
  const ds = d.dataset;
  if (ds.mode) { pref.mode = ds.mode; savePref(); renderComposer(); $('#q').value = ds.ex; autosize(); $('#q').focus(); return; }
  if (ds.copytext) return copy(texts[ds.copytext]);
  if (ds.exp) { expanded.has(ds.exp) ? expanded.delete(ds.exp) : expanded.add(ds.exp); return renderChat(); }
  const t = chat && chat.turns[ds.mem ?? ds.copysum ?? ds.reask];
  if (ds.mem !== undefined) { await api('/api/memory/add', { pid, text:`【${t.q.slice(0, 40)}】\n${t.summary}` }); await load(); return toast('已加入專案記憶'); }
  if (ds.copysum !== undefined) return copy(t.summary, '已複製結論');
  if (ds.reask !== undefined) { $('#q').value = t.q; autosize(); return $('#q').focus(); }
  if (ds.continue !== undefined) { const r = await api('/api/continue', { pid, cid }); if (r.error) return toast(r.error); await tick(); }
};
$('#log').addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (e.target.open) { opened.add(k); closed.delete(k); } else { closed.add(k); opened.delete(k); }
}, true);
$('#copyp').onclick = () => copy($('#pp').value, '已複製提示');
$('#sendp').onclick = async () => { await api('/api/manual', { text:$('#paste').value }); $('#paste').value = ''; tick(); };

/* 對話框 */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
$('#projset').onclick = () => { const p = P() || {}; $('#pname').value = p.name || ''; $('#pinst').value = p.instructions || ''; $('#pmem').value = p.memory || ''; $('#dlgProj').showModal(); };
$('#savep').onclick = async () => { await api('/api/project/update', { pid, name:$('#pname').value, instructions:$('#pinst').value, memory:$('#pmem').value }); $('#dlgProj').close(); await load(); toast('專案已儲存'); };
$('#delp').onclick = async () => { if (!confirm('刪除整個專案與其中所有對話？無法復原。')) return; const r = await api('/api/project/delete', { pid }); if (r.error) return toast(r.error); $('#dlgProj').close(); pid = null; load(); };
$('#aiset').onclick = () => {
  $('#aiform').innerHTML = Object.keys(D.settings.ais).map(k => `<div class="aiset">${av(k)}<b>${esc(ai(k).name)}</b>
    <input class="field" data-k="${k}" data-f="cmd" value="${esc(ai(k).cmd)}" placeholder="CLI 指令（留空 = 手動貼上）">
    <input class="field" data-k="${k}" data-f="role" value="${esc(ai(k).role)}" placeholder="角色，例如：專找漏洞的審查者">
    <label class="sk"><input type="checkbox" data-k="${k}" data-f="skills" ${ai(k).skills ? 'checked' : ''}> 允許使用技能與工具<span class="small">（可在工作資料夾執行指令、產生檔案）</span></label></div>`).join('');
  $('#dlgAI').showModal();

$('#openwork').onclick = () => api('/api/open-work', {});
$('#saveai').onclick = async () => {

/* 設定精靈：偵測每個 AI 有沒有安裝、登入，能不能正常回答 */
function setupState(r) {
  const t = SU.test[r.id];
  if (r.manual) return ['man', '✋ 手動模式', '沒有可自動呼叫的程式。提問時會請你把提示貼到它的網站，再把回覆貼回來。'];
  if (SU.busy[r.id]) return ['warn', '⏳ 測試中', '正在請它回覆一句話，通常 5～30 秒…'];
  if (!r.installed) return ['bad', '❌ 未安裝', `找不到「${r.exe}」。` + (r.canInstall ? '按「安裝」會開一個視窗自動安裝，完成後按「重新檢查」。' : '')];
  if (t && !t.ok) return t.action === 'login' ? ['warn', '⚠️ 未登入', t.text + '按「登入」，照視窗指示登入後再測試一次。'] : ['bad', '❌ 測試失敗', t.text];
  if (t) return ['ok', '✅ 可用', t.text];
  if (r.loggedIn === false) return ['warn', '⚠️ 未登入', '已安裝但還沒登入。按「登入」會開一個視窗，照指示登入後按「重新檢查」。'];
  return ['ok', r.loggedIn ? '✅ 已登入' : '✅ 已安裝', '按「測試」確認它能正常回答。'];
}
function renderSetup() {
  if (!SU.list) { $('#setupList').innerHTML = '<div class="shimmer"></div><div class="shimmer"></div><div class="small">正在偵測你電腦上的 AI 程式…</div>'; return; }
  $('#setupList').innerHTML = SU.list.map(r => {
    const [c, label, detail] = setupState(r), t = SU.test[r.id], b = [];
    const btn = (act, txt, gold) => `<button class="btn${gold ? ' gold' : ''}" data-su="${act}" data-id="${r.id}" ${SU.busy[r.id] ? 'disabled' : ''}>${txt}</button>`;
    if (!r.manual && !r.installed && r.canInstall) b.push(btn('install', '安裝', 1));
    if (r.installed && r.canLogin && (r.loggedIn === false || t?.action === 'login')) b.push(btn('login', '登入', 1));
    if (r.installed) b.push(btn('test', '測試'));
    if (!r.manual && !r.installed && r.page) b.push(btn('page', '說明'));
    return `<div class="srow">${av(r.id)}<div><b>${esc(r.name)}</b><span class="st ${c}">${label}</span><div class="small sm">${esc(detail)}</div></div><div class="sa">${b.join('')}</div></div>`;
  }).join('');
}
async function checkSetup() { SU.list = null; SU.test = {}; renderSetup(); SU.list = await api('/api/setup/check', {}); renderSetup(); }
function openSetup() { if (!$('#dlgSetup').open) $('#dlgSetup').showModal(); checkSetup(); }
$('#setupList').onclick = async e => {
  const b = e.target.closest('[data-su]'); if (!b || b.disabled) return;
  const { su, id } = b.dataset;
  if (su === 'test') { SU.busy[id] = true; renderSetup(); SU.test[id] = await api('/api/setup/test', { id }); SU.busy[id] = false; return renderSetup(); }
  await api('/api/setup/open', { id, action:su });
  if (su !== 'page') toast('已開啟視窗，完成後回來按「重新檢查」');
};
$('#setupRe').onclick = checkSetup;
$('#setupGo').onclick = () => {   // 只勾選偵測通過的 AI
  const ok = (SU.list || []).filter(r => r.installed && r.loggedIn !== false && SU.test[r.id]?.ok !== false).map(r => r.id);
  if (ok.length) { pref.ids = ok; savePref(); renderComposer(); }
  $('#dlgSetup').close();
};
$('#dlgSetup').addEventListener('close', () => { if (!D.settings.setupDone) { D.settings.setupDone = true; api('/api/setup/done', {}); } });

/* 深淺色 */

  document.documentElement.dataset.theme = t;
}
